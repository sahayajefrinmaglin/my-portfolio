<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Place Your Order - Bakery</title>

    <link rel="stylesheet" href="./css/navbar.css">
    <link rel="stylesheet" href="./css/order.css">
</head>

<body>

    <header>
          
    <div class="logo">
        <a href="./index.html">
            <img src="./Images/logo4.png">
        </a>
    </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="menu.html">Menu</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>


    <main class="order-page">

        <h1>Place Your Order</h1>

        <p>Fill in the details below and we'll get your order ready.</p>


        <form id="orderForm">

            <div class="form-group">

                <label for="name">Your Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label for="product">Select Product</label>

                <select id="product" name="product" required>

                    <option value="">-- Select a product --</option>

                    <option value="Chocolate Cake">
                        Chocolate Cake
                    </option>

                    <option value="Vanilla Cake">
                        Vanilla Cake
                    </option>

                    <option value="Red Velvet Cake">
                        Red Velvet Cake
                    </option>

                    <option value="Cupcakes">
                        Cupcakes
                    </option>

                    <option value="Croissant">
                        Croissant
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="quantity">Quantity</label>

                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="1"
                    value="1"
                    required
                >

            </div>


            <div class="form-group">

                <label for="address">Delivery Address</label>

                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter your delivery address"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="message">Special Instructions</label>

                <textarea
                    id="message"
                    name="message"
                    placeholder="Any special request?"
                ></textarea>

            </div>


            <button type="submit" class="submit-order">
                Place Order
            </button>

        </form>


        <p id="orderMessage"></p>

    </main>


    <script src="./js/order.js"></script>

</body>
</html>
